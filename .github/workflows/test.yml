name: Thor compatibility tests

on:
  push:
    branches: [ thor-compatibility ]
  pull_request:
    branches: [ thor-compatibility ]

jobs:
  test-solo:
    name: Test Solo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up environment
        uses: ./.github/actions/setup
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Check Docker Compose
        run: docker compose --version
      
      - name: Run Solo Tests
        run: npm run test:solo:gha
        
  test-galactica:
    name: Test Galactica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
    
      - name: Set up environment
        uses: ./.github/actions/setup

      - name: Check installation
        run: ls -la node_modules && ls -la node_modules/.bin && ./node_modules/.bin/hardhat --version

      - name: Run Galactica Tests
        run: npm run test:galactica:testnet
